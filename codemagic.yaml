workflows:
  android-workflow:
    name: FF MAX APK Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Create Android Project Files
        script: |
          mkdir -p app/src/main/java/com/panel/ffmax
          mkdir -p app/src/main/jni
          
          cat << 'EOF' > app/src/main/jni/injector.cpp
          #include <jni.h>
          #include <unistd.h>
          #include <sys/ptrace.h>
          #include <android/log.h>
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "FFMX", __VA_ARGS__)
          extern "C" JNIEXPORT jint JNICALL Java_com_panel_ffmax_MainActivity_inject(JNIEnv* env, jobject thiz, jstring pkg) {
              LOGI("Injector engine loaded");
              return 0;
          }
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat << 'EOF' > settings.gradle
          rootProject.name = "ffmax_panel"
          include ':app'
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace 'com.panel.ffmax'
              compileSdk 33
              defaultConfig { 
                  applicationId "com.panel.ffmax"
                  minSdk 24
                  targetSdk 33 
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
              } 
              externalNativeBuild { cmake { path 'src/main/jni/CMakeLists.txt' } }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FF MAX">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/panel/ffmax/MainActivity.java
          package com.panel.ffmax;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.LinearLayout;
          public class MainActivity extends Activity {
              static { System.loadLibrary("cheat"); }
              public native int inject(String pkg);
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 50, 50, 50);

                  TextView text = new TextView(this);
                  text.setText("C++ Engine Ready!");
                  text.setTextSize(24);

                  Button btn = new Button(this);
                  btn.setText("START INJECTOR");
                  btn.setOnClickListener(v -> inject("com.dts.freefiremax"));

                  layout.addView(text);
                  layout.addView(btn);
                  setContentView(layout);
              }
          }
          EOF
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
