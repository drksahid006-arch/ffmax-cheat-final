workflows:
  android-workflow:
    name: FF MAX APK Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Create Android Project Files
        script: |
          mkdir -p app/src/main/java/com/panel/ffmax
          mkdir -p app/src/main/jni
          
          cat << 'EOF' > app/src/main/jni/injector.cpp
          #include <jni.h>
          #include <unistd.h>
          #include <android/log.h>
          #include <cstring>
          #include <cstdio>
          #include <cmath>

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "FFMX", __VA_ARGS__)

          struct Vec3 { float x, y, z; };

          namespace offsets {
              uintptr_t IL2CPP_BASE = 0;
              uintptr_t ENTITY_LIST = 0x9C8E14C;
              uintptr_t ENTITY_STRIDE = 0x10;
              uintptr_t VIEW_MATRIX = 0x968CB2F0;
              uintptr_t HEALTH_OFFSET = 0x2A8;
              uintptr_t TEAM_OFFSET = 0x2B0;
              uintptr_t HEAD_BONE = 0x3A4;
          }

          // Menu States
          bool enableESP = false;
          bool enableAimbot = false;

          uintptr_t GetModuleBase(const char* moduleName) {
              FILE* file = fopen("/proc/self/maps", "r");
              if (!file) return 0;
              char line[512];
              uintptr_t base = 0;
              while (fgets(line, sizeof(line), file)) {
                  if (strstr(line, moduleName)) {
                      base = strtoull(line, nullptr, 16);
                      break;
                  }
              }
              fclose(file);
              return base;
          }

          template <typename T>
          T ReadMemory(uintptr_t addr) {
              if (addr == 0) return T{};
              return *(T*)addr;
          }

          bool WorldToScreen(const Vec3& w, const float* m, int sw, int sh, float& sx, float& sy) {
              float cx = w.x*m[0] + w.y*m[4] + w.z*m[8]  + m[12];
              float cy = w.x*m[1] + w.y*m[5] + w.z*m[9]  + m[13];
              float cw = w.x*m[3] + w.y*m[7] + w.z*m[11] + m[15];
              if (cw < 0.1f) return false;
              sx = (sw * 0.5f) * (1.0f + cx / cw);
              sy = (sh * 0.5f) * (1.0f - cy / cw);
              return true;
          }

          // JNI Functions to toggle features from Java UI
          extern "C" JNIEXPORT void JNICALL
          Java_com_panel_ffmax_FloatingService_toggleESP(JNIEnv* env, jobject thiz, jboolean state) {
              enableESP = state;
              LOGI("ESP Toggled: %d", enableESP);
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_panel_ffmax_FloatingService_toggleAimbot(JNIEnv* env, jobject thiz, jboolean state) {
              enableAimbot = state;
              LOGI("Aimbot Toggled: %d", enableAimbot);
          }

          extern "C" JNIEXPORT jint JNICALL
          Java_com_panel_ffmax_MainActivity_inject(JNIEnv* env, jobject thiz, jstring pkg) {
              offsets::IL2CPP_BASE = GetModuleBase("libil2cpp.so");
              if (!offsets::IL2CPP_BASE) return -1;
              
              while (true) {
                  if (enableESP || enableAimbot) {
                      uintptr_t entityList = ReadMemory<uintptr_t>(offsets::IL2CPP_BASE + offsets::ENTITY_LIST);
                      if (entityList != 0) {
                          float viewMatrix[16];
                          memcpy(viewMatrix, (void*)(offsets::IL2CPP_BASE + offsets::VIEW_MATRIX), sizeof(viewMatrix));
                          
                          for (int i = 0; i < 50; i++) {
                              uintptr_t entity = entityList + (i * offsets::ENTITY_STRIDE);
                              int health = ReadMemory<int>(entity + offsets::HEALTH_OFFSET);
                              if (health > 0 && health < 1000) {
                                  Vec3 pos = ReadMemory<Vec3>(entity + offsets::HEAD_BONE);
                                  float sx, sy;
                                  if (WorldToScreen(pos, viewMatrix, 1080, 2400, sx, sy)) {
                                      if (enableESP) {
                                          // Logs coordinate if ESP is on
                                          LOGI("ESP: Enemy at %f, %f", sx, sy);
                                      }
                                  }
                              }
                          }
                      }
                  }
                  usleep(10000);
              }
              return 0;
          }
          EOF

          cat << 'EOF' > app/src/main/jni/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project(cheat CXX)
          add_library(cheat SHARED injector.cpp)
          target_link_libraries(cheat log android dl)
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat << 'EOF' > settings.gradle
          rootProject.name = "ffmax_panel"
          include ':app'
          EOF
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace 'com.panel.ffmax'
              compileSdk 33
              defaultConfig { 
                  applicationId "com.panel.ffmax"
                  minSdk 24
                  targetSdk 33 
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
              } 
              externalNativeBuild { cmake { path 'src/main/jni/CMakeLists.txt' } }
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application android:label="FF MAX PRO">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:exported="false"/>
              </application>
          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/panel/ffmax/MainActivity.java
          package com.panel.ffmax;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              static { System.loadLibrary("cheat"); }
              public native int inject(String pkg);
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 50, 50, 50);
                  layout.setBackgroundColor(Color.parseColor("#121212"));

                  Button startMenu = new Button(this);
                  startMenu.setText("START FLOATING MENU");
                  startMenu.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(MainActivity.this)) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      } else {
                          startService(new Intent(MainActivity.this, FloatingService.class));
                      }
                  });
                  layout.addView(startMenu);
                  setContentView(layout);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/panel/ffmax/FloatingService.java
          package com.panel.ffmax;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.CheckBox;
          import android.widget.TextView;

          public class FloatingService extends Service {
              static { System.loadLibrary("cheat"); }
              public native void toggleESP(boolean state);
              public native void toggleAimbot(boolean state);
              
              private WindowManager windowManager;
              private LinearLayout floatingView;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  floatingView = new LinearLayout(this);
                  floatingView.setOrientation(LinearLayout.VERTICAL);
                  floatingView.setBackgroundColor(Color.parseColor("#CC000000"));
                  floatingView.setPadding(30, 30, 30, 30);

                  CheckBox espLine = new CheckBox(this); espLine.setText("ESP Box"); espLine.setTextColor(Color.WHITE);
                  espLine.setOnCheckedChangeListener((v, isChecked) -> toggleESP(isChecked));

                  CheckBox aimbot = new CheckBox(this); aimbot.setText("Aimbot"); aimbot.setTextColor(Color.WHITE);
                  aimbot.setOnCheckedChangeListener((v, isChecked) -> toggleAimbot(isChecked));

                  floatingView.addView(espLine);
                  floatingView.addView(aimbot);

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT);
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = 100; params.y = 100;

                  windowManager.addView(floatingView, params);
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingView != null) windowManager.removeView(floatingView);
              }
          }
          EOF
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
