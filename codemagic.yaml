workflows:
  android-workflow:
    name: FF MAX APK Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Create Android Project Files
        script: |
          mkdir -p app/src/main/java/com/panel/ffmax
          mkdir -p app/src/main/jni
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          
          # 1. C++ Injector Engine
          cat << 'EOF' > app/src/main/jni/injector.cpp
          #include <jni.h>
          #include <unistd.h>
          #include <android/log.h>
          #include <cstring>
          #include <cstdio>

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "FFMX", __VA_ARGS__)

          namespace offsets {
              uintptr_t IL2CPP_BASE = 0;
              uintptr_t ENTITY_LIST = 0x9C8E14C;
              uintptr_t ENTITY_STRIDE = 0x10;
              uintptr_t VIEW_MATRIX = 0x968CB2F0;
              uintptr_t HEALTH_OFFSET = 0x2A8;
              uintptr_t TEAM_OFFSET = 0x2B0;
              uintptr_t HEAD_BONE = 0x3A4;
          }

          uintptr_t GetModuleBase(const char* moduleName) {
              FILE* file = fopen("/proc/self/maps", "r");
              if (!file) return 0;
              char line[512];
              uintptr_t base = 0;
              while (fgets(line, sizeof(line), file)) {
                  if (strstr(line, moduleName)) {
                      base = strtoull(line, nullptr, 16);
                      break;
                  }
              }
              fclose(file);
              return base;
          }

          extern "C" JNIEXPORT jint JNICALL
          Java_com_panel_ffmax_MainActivity_inject(JNIEnv* env, jobject thiz, jstring pkg) {
              offsets::IL2CPP_BASE = GetModuleBase("libil2cpp.so");
              if (!offsets::IL2CPP_BASE) {
                  LOGI("Game not running!");
                  return -1;
              }
              LOGI("Injected. Base: 0x%lx", offsets::IL2CPP_BASE);
              return 0;
          }
          EOF

          cat << 'EOF' > app/src/main/jni/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project(cheat CXX)
          add_library(cheat SHARED injector.cpp)
          target_link_libraries(cheat log android dl)
          EOF

          # 2. Gradle Build Config
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat << 'EOF' > settings.gradle
          rootProject.name = "ffmax_panel"
          include ':app'
          EOF
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace 'com.panel.ffmax'
              compileSdk 33
              defaultConfig { 
                  applicationId "com.panel.ffmax"
                  minSdk 24
                  targetSdk 33 
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
              } 
              externalNativeBuild { cmake { path 'src/main/jni/CMakeLists.txt' } }
          }
          EOF

          # 3. AndroidManifest (Permissions for Overlay)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:label="FF MAX PRO">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:exported="false"/>
              </application>
          </manifest>
          EOF

          # 4. Dashboard UI (MainActivity)
          cat << 'EOF' > app/src/main/java/com/panel/ffmax/MainActivity.java
          package com.panel.ffmax;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;

          public class MainActivity extends Activity {
              static { System.loadLibrary("cheat"); }
              public native int inject(String pkg);
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.parseColor("#0a0a0a"));
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(50, 50, 50, 50);

                  TextView status = new TextView(this);
                  status.setText("SYSTEM: ONLINE\nConnected to Server");
                  status.setTextColor(Color.GREEN);
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);

                  Button btnOverlay = new Button(this);
                  btnOverlay.setText("START FLOATING MENU");
                  btnOverlay.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      } else {
                          startService(new Intent(this, FloatingService.class));
                          finish();
                      }
                  });

                  Button btnGame = new Button(this);
                  btnGame.setText("OPEN FREE FIRE");
                  btnGame.setOnClickListener(v -> {
                      Intent launchIntent = getPackageManager().getLaunchIntentForPackage("com.dts.freefiremax");
                      if (launchIntent != null) startActivity(launchIntent);
                  });

                  layout.addView(status);
                  layout.addView(btnOverlay);
                  layout.addView(btnGame);
                  setContentView(layout);
              }
          }
          EOF

          # 5. Floating Menu Service (Overlay)
          cat << 'EOF' > app/src/main/java/com/panel/ffmax/FloatingService.java
          package com.panel.ffmax;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;

          public class FloatingService extends Service {
              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.parseColor("#CC000000"));
                  layout.setPadding(30, 30, 30, 30);

                  TextView title = new TextView(this);
                  title.setText("PRO PANEL");
                  title.setTextColor(Color.CYAN);

                  CheckBox espLine = new CheckBox(this); espLine.setText("ESPLINE"); espLine.setTextColor(Color.WHITE);
                  CheckBox espBox = new CheckBox(this); espBox.setText("ESP BOX"); espBox.setTextColor(Color.WHITE);
                  CheckBox aimlock = new CheckBox(this); aimlock.setText("AIMLOCK"); aimlock.setTextColor(Color.WHITE);
                  CheckBox autoHead = new CheckBox(this); autoHead.setText("AUTO HEADSHOT"); autoHead.setTextColor(Color.WHITE);
                  
                  Button close = new Button(this);
                  close.setText("CLOSE");
                  close.setOnClickListener(v -> stopSelf());

                  layout.addView(title);
                  layout.addView(espLine);
                  layout.addView(espBox);
                  layout.addView(aimlock);
                  layout.addView(autoHead);
                  layout.addView(close);

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);

                  params.gravity = Gravity.TOP | Gravity.LEFT;
                  params.x = 100; params.y = 200;
                  wm.addView(layout, params);
              }
          }
          EOF
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
