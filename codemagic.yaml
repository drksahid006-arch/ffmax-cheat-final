workflows:
  android-workflow:
    name: FF MAX APK Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Create Android Project Files
        script: |
          mkdir -p app/src/main/java/com/panel/ffmax
          mkdir -p app/src/main/jni
          
          cat << 'EOF' > app/src/main/jni/injector.cpp
          #include <jni.h>
          #include <unistd.h>
          #include <sys/ptrace.h>
          #include <android/log.h>
          extern "C" JNIEXPORT jint JNICALL Java_com_panel_ffmax_MainActivity_inject(JNIEnv* env, jobject thiz, jstring pkg) {
              __android_log_print(ANDROID_LOG_INFO, "FFMX", "Injector loaded");
              return 0;
          }
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat << 'EOF' > settings.gradle
          rootProject.name = "ffmax_panel"
          include ':app'
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace 'com.panel.ffmax'
              compileSdk 33
              defaultConfig { 
                  applicationId "com.panel.ffmax"
                  minSdk 24
                  targetSdk 33 
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
              } 
              externalNativeBuild { cmake { path 'src/main/jni/CMakeLists.txt' } }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FF MAX">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/panel/ffmax/MainActivity.java
          package com.panel.ffmax;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.CheckBox;
          import android.widget.SeekBar;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              static { System.loadLibrary("cheat"); }
              public native int inject(String pkg);
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 50, 50, 50);
                  layout.setBackgroundColor(Color.parseColor("#121212"));

                  TextView title = new TextView(this);
                  title.setText("FF MAX PROFESSIONAL PANEL");
                  title.setTextColor(Color.CYAN);
                  title.setTextSize(22);
                  title.setPadding(0, 0, 0, 30);
                  
                  Button startBtn = new Button(this);
                  startBtn.setText("START INJECTOR");
                  startBtn.setOnClickListener(v -> inject("com.dts.freefiremax"));

                  CheckBox espBox = new CheckBox(this);
                  espBox.setText("ESP Box (Line, Box, Name)");
                  espBox.setTextColor(Color.WHITE);
                  
                  CheckBox espLine = new CheckBox(this);
                  espLine.setText("ESP Line");
                  espLine.setTextColor(Color.WHITE);
                  
                  CheckBox aimbot = new CheckBox(this);
                  aimbot.setText("Aimbot / Aimlock");
                  aimbot.setTextColor(Color.WHITE);
                  
                  CheckBox autoHead = new CheckBox(this);
                  autoHead.setText("Auto Headshot");
                  autoHead.setTextColor(Color.WHITE);
                  
                  CheckBox flyHack = new CheckBox(this);
                  flyHack.setText("Fly Hack");
                  flyHack.setTextColor(Color.WHITE);
                  
                  TextView fovLabel = new TextView(this);
                  fovLabel.setText("Aim FOV: 120");
                  fovLabel.setTextColor(Color.WHITE);
                  
                  SeekBar fovBar = new SeekBar(this);
                  fovBar.setMax(200);
                  fovBar.setProgress(120);

                  layout.addView(title);
                  layout.addView(startBtn);
                  layout.addView(espBox);
                  layout.addView(espLine);
                  layout.addView(aimbot);
                  layout.addView(autoHead);
                  layout.addView(flyHack);
                  layout.addView(fovLabel);
                  layout.addView(fovBar);

                  setContentView(layout);
              }
          }
          EOF
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
