workflows:
  android-workflow:
    name: FF MAX PRO Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Generate Files
        script: |
          mkdir -p app/src/main/java/com/panel/ffmax
          mkdir -p app/src/main/jni
          
          cat << 'EOF' > app/src/main/jni/injector.cpp
          #include <jni.h>
          #include <unistd.h>
          #include <android/log.h>
          #include <cstring>
          #include <cstdio>
          #include <cmath>
          
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "FFMX", __VA_ARGS__)

          struct Vec3 { float x, y, z; };

          namespace offsets {
              uintptr_t IL2CPP_BASE = 0;
              uintptr_t ENTITY_LIST = 0x9C8E14C; // Assuming this from earlier
              uintptr_t ENTITY_STRIDE = 0x10;    // Assuming this from earlier
              uintptr_t VIEW_MATRIX = 0x968CB2F0;// Assuming this from earlier
              uintptr_t HEALTH_OFFSET = 0x2A8;   // Assuming this from earlier
              
              // --- YOUR CONFIRMED OB55 BONE OFFSETS ---
              uintptr_t HEAD_BONE = 0x49C;       // From your image (3EA section)
              uintptr_t HIP_BONE = 0x4A0;        // From your image
              uintptr_t COLLIDER_DISTANCE = 0x100;// From your image
          }

          bool espOn = false; bool aimbotOn = false;

          uintptr_t GetBase(const char* name) { 
              FILE* f = fopen("/proc/self/maps", "r"); 
              if(!f) return 0; 
              char line[512]; uintptr_t base = 0; 
              while(fgets(line, 512, f)) { 
                  if(strstr(line, name)) { base = strtoull(line, nullptr, 16); break; } 
              } 
              fclose(f); return base; 
          }

          template <typename T> T Read(uintptr_t addr) { if(!addr) return T{}; return *(T*)addr; }

          bool WorldToScreen(const Vec3& w, const float* m, int sw, int sh, float& sx, float& sy) {
              float cx = w.x*m[0] + w.y*m[4] + w.z*m[8]  + m[12];
              float cy = w.x*m[1] + w.y*m[5] + w.z*m[9]  + m[13];
              float cw = w.x*m[3] + w.y*m[7] + w.z*m[11] + m[15];
              if (cw < 0.1f) return false;
              sx = (sw * 0.5f) * (1.0f + cx / cw);
              sy = (sh * 0.5f) * (1.0f - cy / cw);
              return true;
          }

          extern "C" JNIEXPORT void JNICALL Java_com_panel_ffmax_FloatingService_toggleESP(JNIEnv* env, jobject thiz, jboolean s) { espOn = s; }
          extern "C" JNIEXPORT void JNICALL Java_com_panel_ffmax_FloatingService_toggleAimbot(JNIEnv* env, jobject thiz, jboolean s) { aimbotOn = s; }

          extern "C" JNIEXPORT jint JNICALL Java_com_panel_ffmax_MainActivity_inject(JNIEnv* env, jobject thiz, jstring pkg) {
              offsets::IL2CPP_BASE = GetBase("libil2cpp.so");
              if(!offsets::IL2CPP_BASE) {
                  LOGI("Error: libil2cpp.so not found! Is the game running?");
                  return -1;
              }
              
              LOGI("Engine Started! Base: %lx", offsets::IL2CPP_BASE);

              while(true) {
                  if(espOn || aimbotOn) {
                      uintptr_t list = Read<uintptr_t>(offsets::IL2CPP_BASE + offsets::ENTITY_LIST);
                      if(list != 0) {
                          float viewMatrix[16];
                          memcpy(viewMatrix, (void*)(offsets::IL2CPP_BASE + offsets::VIEW_MATRIX), sizeof(viewMatrix));
                          
                          for(int i=0; i<50; i++) {
                              uintptr_t entity = list + (i * offsets::ENTITY_STRIDE);
                              int health = Read<int>(entity + offsets::HEALTH_OFFSET);
                              
                              if(health > 0 && health < 1000) {
                                  // READ HEAD BONE POSITION USING YOUR 0x49C OFFSET
                                  Vec3 headPos = Read<Vec3>(entity + offsets::HEAD_BONE);
                                  float sx, sy;
                                  if(WorldToScreen(headPos, viewMatrix, 1080, 2400, sx, sy)) {
                                      if(espOn) {
                                          LOGI("ESP FOUND ENEMY HEAD AT: X=%f, Y=%f", sx, sy);
                                      }
                                  }
                              }
                          }
                      }
                  }
                  usleep(10000);
              }
              return 0;
          }
          EOF

          cat << 'EOF' > app/src/main/jni/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project(cheat CXX)
          add_library(cheat SHARED injector.cpp)
          target_link_libraries(cheat log android dl)
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat << 'EOF' > settings.gradle
          rootProject.name = "ffmax_panel"
          include ':app'
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace 'com.panel.ffmax'
              compileSdk 33
              defaultConfig { 
                  applicationId "com.panel.ffmax"; minSdk 24; targetSdk 33 
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
              } 
              externalNativeBuild { cmake { path 'src/main/jni/CMakeLists.txt' } }
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application android:label="FF PRO">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
                  <service android:name=".FloatingService"/>
              </application>
          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/panel/ffmax/MainActivity.java
          package com.panel.ffmax;
          import android.app.Activity; import android.content.Intent; import android.net.Uri; import android.os.Bundle; import android.provider.Settings; import android.widget.Button; import android.widget.LinearLayout; import android.graphics.Color;
          public class MainActivity extends Activity {
              static { System.loadLibrary("cheat"); }
              public native int inject(String pkg);
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout layout = new LinearLayout(this); layout.setOrientation(LinearLayout.VERTICAL); layout.setPadding(50, 50, 50, 50); layout.setBackgroundColor(Color.parseColor("#121212"));
                  Button startMenu = new Button(this); startMenu.setText("START PRO MENU"); startMenu.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      else { startService(new Intent(this, FloatingService.class)); inject("com.dts.freefiremax"); }
                  });
                  layout.addView(startMenu); setContentView(layout);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/panel/ffmax/FloatingService.java
          package com.panel.ffmax;
          import android.app.Service; import android.content.Intent; import android.graphics.Color; import android.graphics.PixelFormat; import android.os.IBinder; import android.view.Gravity; import android.view.MotionEvent; import android.view.View; import android.view.WindowManager; import android.widget.LinearLayout; import android.widget.CheckBox; import android.widget.TextView; import android.widget.ImageView;
          public class FloatingService extends Service {
              static { System.loadLibrary("cheat"); }
              public native void toggleESP(boolean s); public native void toggleAimbot(boolean s);
              private WindowManager wm; private LinearLayout menuView; private ImageView iconView;
              private WindowManager.LayoutParams menuParams; private WindowManager.LayoutParams iconParams;
              private boolean isMenuOpen = false;
              @Override public IBinder onBind(Intent i) { return null; }
              @Override public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  iconView = new ImageView(this); iconView.setImageResource(android.R.drawable.ic_menu_manage); iconView.setBackgroundColor(Color.parseColor("#80000000")); iconView.setPadding(15,15,15,15);
                  iconParams = new WindowManager.LayoutParams(120, 120, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  iconParams.gravity = Gravity.TOP | Gravity.START; iconParams.x = 200; iconParams.y = 300;
                  wm.addView(iconView, iconParams);
                  menuView = new LinearLayout(this); menuView.setOrientation(LinearLayout.VERTICAL); menuView.setBackgroundColor(Color.parseColor("#CC000000")); menuView.setPadding(30, 30, 30, 30);
                  TextView title = new TextView(this); title.setText("PRO MOD MENU"); title.setTextColor(Color.CYAN); menuView.addView(title);
                  CheckBox esp = new CheckBox(this); esp.setText("ESP Box"); esp.setTextColor(Color.WHITE); esp.setOnCheckedChangeListener((v, c) -> toggleESP(c)); menuView.addView(esp);
                  CheckBox aim = new CheckBox(this); aim.setText("Aimbot"); aim.setTextColor(Color.WHITE); aim.setOnCheckedChangeListener((v, c) -> toggleAimbot(c)); menuView.addView(aim);
                  menuParams = new WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  menuParams.gravity = Gravity.TOP | Gravity.START; menuParams.x = 200; menuParams.y = 450;
                  iconView.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY; private float initialTouchX, initialTouchY;
                      @Override public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  initialX = iconParams.x; initialY = iconParams.y; initialTouchX = event.getRawX(); initialTouchY = event.getRawY(); return true;
                              case MotionEvent.ACTION_UP:
                                  if (Math.abs(event.getRawX() - initialTouchX) < 10 && Math.abs(event.getRawY() - initialTouchY) < 10) {
                                      if (isMenuOpen) { wm.removeView(menuView); isMenuOpen = false; }
                                      else { wm.addView(menuView, menuParams); isMenuOpen = true; }
                                  } return true;
                              case MotionEvent.ACTION_MOVE:
                                  iconParams.x = initialX + (int) (event.getRawX() - initialTouchX); iconParams.y = initialY + (int) (event.getRawY() - initialTouchY);
                                  wm.updateViewLayout(iconView, iconParams); return true;
                          } return false;
                      }
                  });
              }
              @Override public void onDestroy() { super.onDestroy(); if (iconView != null) wm.removeView(iconView); if (isMenuOpen) wm.removeView(menuView); }
          }
          EOF
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
