          cat << 'EOF' > app/src/main/java/com/panel/ffmax/MainActivity.java
          package com.panel.ffmax;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.CheckBox;
          import android.widget.SeekBar;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              static { System.loadLibrary("cheat"); }
              public native int inject(String pkg);
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(50, 50, 50, 50);
                  layout.setBackgroundColor(Color.parseColor("#121212"));

                  TextView title = new TextView(this);
                  title.setText("FF MAX PROFESSIONAL PANEL");
                  title.setTextColor(Color.CYAN);
                  title.setTextSize(22);
                  title.setPadding(0, 0, 0, 30);
                  
                  Button startBtn = new Button(this);
                  startBtn.setText("START INJECTOR");
                  startBtn.setOnClickListener(v -> inject("com.dts.freefiremax"));

                  CheckBox espBox = new CheckBox(this);
                  espBox.setText("ESP Box (Line, Box, Name)");
                  espBox.setTextColor(Color.WHITE);
                  
                  CheckBox espLine = new CheckBox(this);
                  espLine.setText("ESP Line");
                  espLine.setTextColor(Color.WHITE);
                  
                  CheckBox aimbot = new CheckBox(this);
                  aimbot.setText("Aimbot / Aimlock");
                  aimbot.setTextColor(Color.WHITE);
                  
                  CheckBox autoHead = new CheckBox(this);
                  autoHead.setText("Auto Headshot");
                  autoHead.setTextColor(Color.WHITE);
                  
                  CheckBox flyHack = new CheckBox(this);
                  flyHack.setText("Fly Hack");
                  flyHack.setTextColor(Color.WHITE);
                  
                  TextView fovLabel = new TextView(this);
                  fovLabel.setText("Aim FOV: 120");
                  fovLabel.setTextColor(Color.WHITE);
                  
                  SeekBar fovBar = new SeekBar(this);
                  fovBar.setMax(200);
                  fovBar.setProgress(120);

                  layout.addView(title);
                  layout.addView(startBtn);
                  layout.addView(espBox);
                  layout.addView(espLine);
                  layout.addView(aimbot);
                  layout.addView(autoHead);
                  layout.addView(flyHack);
                  layout.addView(fovLabel);
                  layout.addView(fovBar);

                  setContentView(layout);
              }
          }
          EOF
