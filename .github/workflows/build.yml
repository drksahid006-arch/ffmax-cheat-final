name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Android Files & Fix Paths
        run: |
          rm -rf ffmax-cheat-final
          mkdir -p app/src/main/java/com/panel/ffmax
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat << 'EOF' > settings.gradle
          rootProject.name = "ffmax_panel"
          include ':app'
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace 'com.panel.ffmax'
              compileSdk 33
              defaultConfig { applicationId "com.panel.ffmax"; minSdk 24; targetSdk 33 } 
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FF MAX"><activity android:name=".MainActivity"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application>
          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/panel/ffmax/MainActivity.java
          package com.panel.ffmax; import android.app.Activity; import android.os.Bundle;
          public class MainActivity extends Activity { protected void onCreate(Bundle b) { super.onCreate(b); } }
          EOF
          
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      
      - name: Build
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PATH:$PWD/gradle-8.2/bin
          gradle assembleDebug
          
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
